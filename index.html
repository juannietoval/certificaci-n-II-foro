<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Oficial de Verificaci?n | II Foro de Editores de Revistas Cient&iacute;ficas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0b223d;
      --primary-light: #13335a;
      --primary-subtle: #f0f4f9;
      --gold: #b89047;
      --gold-light: #d4af37;
      --gold-subtle: #fdfaf3;
      --green: #059669;
      --green-subtle: #ecfdf5;
      --green-border: #a7f3d0;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --shadow-sm: 0 2px 8px rgba(11, 34, 61, 0.04);
      --shadow-md: 0 10px 30px -5px rgba(11, 34, 61, 0.08), 0 4px 10px -2px rgba(11, 34, 61, 0.03);
      --shadow-lg: 0 20px 40px -10px rgba(11, 34, 61, 0.12), 0 8px 16px -4px rgba(11, 34, 61, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p, span, div {
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* HEADER HERO */
    header {
      background: linear-gradient(180deg, #071628 0%, #0b223d 65%, #0f2c4f 100%);
      color: #ffffff;
      padding: 2.8rem 1.5rem 4.5rem 1.5rem;
      text-align: center;
      position: relative;
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    /* OFFICIAL LOGOS BANNER IN HEADER */
    .logos-capsule {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 0.65rem 1.8rem;
      border-radius: 9999px;
      margin-bottom: 1.6rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(184, 144, 71, 0.3);
      transition: transform 0.2s;
    }

    .logos-capsule:hover {
      transform: translateY(-1px);
    }

    .logos-capsule img {
      height: 44px;
      width: auto;
      max-width: 90vw;
      object-fit: contain;
      display: block;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.85rem;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    header p {
      font-size: 0.95rem;
      color: #94a3b8;
      max-width: 640px;
      margin: 0 auto;
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: -2.2rem auto 4rem auto;
      padding: 0 1.2rem;
      position: relative;
      z-index: 10;
    }

    /* AESTHETIC INTEGRATED SEARCH BAR */
    .search-container {
      margin-bottom: 2rem;
    }

    .search-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 0.45rem 0.5rem 0.45rem 1.2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(11, 34, 61, 0.12);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: all 0.25s ease;
    }

    .search-box:focus-within {
      border-color: var(--gold);
      box-shadow: 0 15px 35px -5px rgba(184, 144, 71, 0.2), 0 0 0 3px rgba(184, 144, 71, 0.15);
      transform: translateY(-2px);
    }

    .search-icon {
      color: var(--gold);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Montserrat', monospace;
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
      background: transparent;
      padding: 0.7rem 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .search-input::placeholder {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      font-weight: 400;
      color: #94a3b8;
      text-transform: none;
      letter-spacing: 0.2px;
    }

    .search-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 0.85rem 1.6rem;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(11, 34, 61, 0.2);
      flex-shrink: 0;
    }

    .search-btn:hover {
      background: linear-gradient(135deg, #13335a 0%, #1a4274 100%);
      box-shadow: 0 6px 16px rgba(11, 34, 61, 0.28);
      transform: translateY(-1px);
    }

    .search-btn:active {
      transform: translateY(0);
    }

    /* QUICK TEST PILLS */
    .quick-examples {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.9rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .sample-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--primary);
      font-family: monospace;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.76rem;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .sample-pill:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-1px);
    }

    /* RESULT CARD */
    .result-card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* STATUS BANNER */
    .status-banner {
      padding: 1.3rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .status-banner.valid {
      background: linear-gradient(90deg, #ecfdf5 0%, #f0fdf4 100%);
      border-left: 6px solid var(--green);
    }

    .status-banner.invalid {
      background: #fef2f2;
      border-left: 6px solid #ef4444;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-banner.valid .status-icon-circle {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .status-banner.invalid .status-icon-circle {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .status-info h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #065f46;
      letter-spacing: 0.5px;
    }

    .status-banner.invalid .status-info h2 {
      color: #991b1b;
    }

    .status-info p {
      font-size: 0.82rem;
      color: #047857;
      margin-top: 1px;
    }

    .status-banner.invalid .status-info p {
      color: #b91c1c;
    }

    .seal-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #065f46;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* CARD BODY */
    .card-body {
      padding: 2.2rem 2.4rem;
    }

    .recipient-header {
      text-align: center;
      padding-bottom: 1.8rem;
      border-bottom: 2px solid var(--border-light);
      margin-bottom: 1.8rem;
    }

    .role-tag {
      display: inline-block;
      background: var(--primary-subtle);
      color: var(--primary);
      border: 1px solid rgba(11, 34, 61, 0.12);
      padding: 0.3rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .recipient-name-display {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .recipient-institution {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* METADATA GRID */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .meta-box {
      background: #f8fafc;
      padding: 1.1rem 1.4rem;
      border-radius: 12px;
      border: 1px solid #edf2f7;
      transition: background 0.15s;
    }

    .meta-box:hover {
      background: #f1f5f9;
    }

    .meta-box.full-width {
      grid-column: 1 / -1;
      background: var(--gold-subtle);
      border-color: rgba(184, 144, 71, 0.2);
    }

    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1.2px;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .meta-box.full-width .meta-label {
      color: #997328;
    }

    .meta-value {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text);
    }

    .presentation-title-display {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.28rem;
      font-weight: 600;
      font-style: italic;
      color: #0f172a;
      line-height: 1.4;
    }

    .code-value {
      font-family: monospace;
      font-size: 1.05rem;
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ACTION BAR */
    .actions-section {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-light);
    }

    .btn-download-pdf {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 0.9rem 1.9rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(11, 34, 61, 0.22);
    }

    .btn-download-pdf:hover {
      background: linear-gradient(135deg, #13335a 0%, #1a4274 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(11, 34, 61, 0.3);
    }

    .btn-copy-link {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 0.9rem 1.4rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-copy-link:hover {
      border-color: var(--primary);
      background: #f8fafc;
      transform: translateY(-1px);
    }

    /* PREVIEW THUMBNAIL */
    .preview-accordion {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px dashed var(--border);
      text-align: center;
    }

    .preview-toggle-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }

    .preview-toggle-btn:hover {
      background: var(--primary-subtle);
    }

    .preview-img-box {
      margin-top: 1.2rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      display: none;
    }

    .preview-img-box.active {
      display: block;
    }

    .preview-img-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* FOOTER */
    footer {
      background: #071628;
      color: #94a3b8;
      text-align: center;
      padding: 2.2rem 1.5rem;
      font-size: 0.84rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: auto;
    }

    footer p {
      margin-bottom: 0.4rem;
    }

    .footer-seal {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

        /* BULLETPROOF MOBILE RESPONSIVE SYSTEM */
    @media (max-width: 640px) {
      header {
        padding: 2rem 0.8rem 3.2rem 0.8rem;
      }
      .logos-capsule {
        padding: 0.4rem 0.8rem;
        margin-bottom: 1.2rem;
        max-width: 95%;
      }
      .logos-capsule img {
        height: 28px;
        max-width: 100%;
      }
      header h1 {
        font-size: 1.12rem;
        letter-spacing: 0.5px;
        line-height: 1.28;
        padding: 0 0.4rem;
      }
      header p {
        font-size: 0.8rem;
        line-height: 1.4;
        padding: 0 0.5rem;
      }
      main {
        margin-top: -1.6rem;
        padding: 0 0.75rem;
        width: 100%;
        max-width: 100%;
      }
      .search-container {
        width: 100%;
      }
      .search-box {
        width: 100%;
        padding: 0.35rem 0.4rem 0.35rem 0.75rem;
        gap: 0.4rem;
      }
      .search-icon svg {
        width: 16px;
        height: 16px;
      }
      .search-input {
        font-size: 0.8rem;
        min-width: 0;
        width: 100%;
        flex: 1 1 auto;
      }
      .search-input::placeholder {
        font-size: 0.74rem;
      }
      .search-btn {
        padding: 0.6rem 0.85rem;
        font-size: 0.78rem;
        gap: 0.3rem;
        flex-shrink: 0;
      }
      .quick-examples {
        flex-direction: row;
        justify-content: center;
        gap: 0.4rem;
        font-size: 0.74rem;
      }
      .sample-pill {
        padding: 0.2rem 0.5rem;
        font-size: 0.72rem;
      }
      .status-banner {
        padding: 1rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
      .status-left {
        gap: 0.75rem;
      }
      .status-icon-circle {
        width: 36px;
        height: 36px;
      }
      .status-icon-circle svg {
        width: 18px;
        height: 18px;
      }
      .status-info h2 {
        font-size: 0.88rem;
        line-height: 1.25;
      }
      .status-info p {
        font-size: 0.75rem;
      }
      .card-body {
        padding: 1.2rem 1rem;
      }
      .recipient-header {
        padding-bottom: 1.2rem;
        margin-bottom: 1.2rem;
      }
      .recipient-name-display {
        font-size: 1.35rem;
        line-height: 1.2;
      }
      .recipient-institution {
        font-size: 0.86rem;
      }
      .meta-grid {
        grid-template-columns: 1fr !important;
        gap: 0.8rem;
        margin-bottom: 1.4rem;
      }
      .meta-box {
        padding: 0.85rem 1rem;
      }
      .presentation-title-display {
        font-size: 1.08rem;
        line-height: 1.35;
      }
      .meta-value {
        font-size: 0.88rem;
      }
      .actions-section {
        flex-direction: column;
        width: 100%;
        gap: 0.75rem;
      }
      .btn-download-pdf, .btn-copy-link {
        width: 100%;
        justify-content: center;
        padding: 0.8rem 1rem;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <!-- JOURNAL LOGOS -->
    <div class="logos-capsule">
      <img src="assets/logos_clean.png" alt="Inclusi?n y Desarrollo | Horizontes Pedag?gicos | Miradas UTP">
    </div>
    <h1>II FORO DE EDITORES DE REVISTAS CIENT&Iacute;FICAS</h1>
    <p>Portal Oficial de Consulta y Validaci&oacute;n de Autenticidad de Certificados Acad&eacute;micos</p>
  </header>

  <main>
    <!-- AESTHETIC SEARCH BAR -->
    <div class="search-container">
      <form class="search-box" id="searchForm" onsubmit="handleSearch(event)">
        <div class="search-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <input type="text" id="certInput" class="search-input" placeholder="Ingresa el c?digo del certificado (ej. FORO26-PON-001)" required autocomplete="off" spellcheck="false">
        <button type="submit" class="search-btn">
          <span>Consultar</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </form>

      <div class="quick-examples">
        <span>C&oacute;digos de prueba r&aacute;pida:</span>
        <button type="button" class="sample-pill" onclick="searchSample('FORO26-PON-001')">FORO26-PON-001</button>
        <button type="button" class="sample-pill" onclick="searchSample('FORO26-PON-002')">FORO26-PON-002</button>
      </div>
    </div>

    <!-- RESULT CONTAINER -->
    <div id="resultContainer"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 II Foro de Editores de Revistas Cient&iacute;ficas &bull; Publicaciones Acad&eacute;micas UTP</p>
    <div class="footer-seal">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
      Acreditaci&oacute;n Oficial con Firma Digital y C&oacute;digo QR
    </div>
  </footer>

  <script>
    // Embedded initial dataset for instantaneous response
    const DEFAULT_CERTS = [
      {
        "id": "FORO26-PON-001",
        "nombre": "Nohelia Alfonzo",
        "rol": "PONENTE",
        "titulo": "CIENCIA ABIERTA EN CONTEXTO DE CRISIS: VISIBILIDAD DIGITAL Y CIRCULACI&Oacute;N DEL CONOCIMIENTO DESDE REVISTAS UNIVERSITARIAS VENEZOLANAS",
        "eje": "Visibilidad cient&iacute;fica y mundo digital",
        "institucion": "Universidad Bicentenaria de Aragua / Universidad de las Ciencias de la Salud",
        "pais": "Venezuela",
        "fecha": "11 de septiembre de 2026",
        "ciudad": "Pereira, Colombia",
        "pdf": "output/pdf/FORO26-PON-001_Nohelia_Alfonzo.pdf",
        "preview": "output/preview/FORO26-PON-001_preview.png"
      },
      {
        "id": "FORO26-PON-002",
        "nombre": "Zahira Silano",
        "rol": "PONENTE",
        "titulo": "CIENCIA ABIERTA EN CONTEXTO DE CRISIS: VISIBILIDAD DIGITAL Y CIRCULACI&Oacute;N DEL CONOCIMIENTO DESDE REVISTAS UNIVERSITARIAS VENEZOLANAS",
        "eje": "Visibilidad cient&iacute;fica y mundo digital",
        "institucion": "Universidad Bicentenaria de Aragua / Universidad de las Ciencias de la Salud",
        "pais": "Venezuela",
        "fecha": "11 de septiembre de 2026",
        "ciudad": "Pereira, Colombia",
        "pdf": "output/pdf/FORO26-PON-002_Zahira_Silano.pdf",
        "preview": "output/preview/FORO26-PON-002_preview.png"
      }
    ];

    let dynamicList = null;
    fetch('data/participantes.json')
      .then(r => r.json())
      .then(d => { dynamicList = d; })
      .catch(() => {});

    function getCert(code) {
      const clean = code.trim().toUpperCase();
      const list = dynamicList || DEFAULT_CERTS;
      return list.find(c => c.id.toUpperCase() === clean);
    }

    function searchSample(code) {
      document.getElementById('certInput').value = code;
      handleSearch();
    }

    function togglePreview() {
      const box = document.getElementById('previewBox');
      const btn = document.getElementById('previewBtn');
      if (box.classList.contains('active')) {
        box.classList.remove('active');
        btn.innerHTML = '<span>Ver vista previa del documento</span> ?';
      } else {
        box.classList.add('active');
        btn.innerHTML = '<span>Ocultar vista previa</span> ?';
      }
    }

    function copyLink(id) {
      const url = `${window.location.origin}${window.location.pathname}?id=${id}`;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerHTML = '? ?Enlace copiado!';
        setTimeout(() => {
          btn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> Copiar Enlace';
        }, 2200);
      });
    }

    function renderCert(cert) {
      const container = document.getElementById('resultContainer');
      if (!cert) {
        container.innerHTML = `
          <div class="result-card">
            <div class="status-banner invalid">
              <div class="status-left">
                <div class="status-icon-circle">?</div>
                <div class="status-info">
                  <h2>CERTIFICADO NO ENCONTRADO</h2>
                  <p>El c?digo no coincide con ning?n registro oficial emitido.</p>
                </div>
              </div>
            </div>
            <div class="card-body" style="text-align:center; padding: 2.4rem 1.5rem;">
              <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 1.4rem auto; font-size: 0.95rem;">
                Por favor verifique que el c?digo est? escrito exactamente como figura bajo el c?digo QR de su documento (ej. <strong>FORO26-PON-001</strong>).
              </p>
            </div>
          </div>
        `;
        return;
      }

      const pdfUrl = cert.pdf || `output/pdf/${cert.id}_${cert.nombre.replace(/\s+/g, '_')}.pdf`;
      const previewUrl = cert.preview || `output/preview/${cert.id}_preview.png`;

      container.innerHTML = `
        <div class="result-card">
          <div class="status-banner valid">
            <div class="status-left">
              <div class="status-icon-circle">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
              </div>
              <div class="status-info">
                <h2>DOCUMENTO OFICIAL V&Aacute;LIDO Y VERIFICADO</h2>
                <p>Acreditaci&oacute;n aut&eacute;ntica registrada en el sistema de eventos acad&eacute;micos.</p>
              </div>
            </div>
            <div class="seal-badge">
              <svg width="12" height="12" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
              Oficial
            </div>
          </div>

          <div class="card-body">
            <div class="recipient-header">
              <span class="role-tag">Calidad: ${cert.rol}</span>
              <h3 class="recipient-name-display">${cert.nombre}</h3>
              <div class="recipient-institution">${cert.institucion} &bull; ${cert.pais}</div>
            </div>

            <div class="meta-grid">
              <div class="meta-box full-width">
                <div class="meta-label">
                  <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"></path></svg>
                  Ponencia Magistral Presentada
                </div>
                <div class="presentation-title-display">&laquo;${cert.titulo}&raquo;</div>
              </div>

              <div class="meta-box">
                <div class="meta-label">Eje Tem&aacute;tico</div>
                <div class="meta-value">${cert.eje}</div>
              </div>

              <div class="meta-box">
                <div class="meta-label">C&oacute;digo de Autenticidad</div>
                <div class="meta-value code-value">${cert.id}</div>
              </div>

              <div class="meta-box">
                <div class="meta-label">Fecha de Emisi&oacute;n</div>
                <div class="meta-value">${cert.fecha}</div>
              </div>

              <div class="meta-box">
                <div class="meta-label">Sede Oficial</div>
                <div class="meta-value">${cert.ciudad}</div>
              </div>
            </div>

            <div class="actions-section">
              <a href="${pdfUrl}" target="_blank" class="btn-download-pdf">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Descargar Certificado PDF Oficial
              </a>
              <button type="button" id="copyBtn" class="btn-copy-link" onclick="copyLink('${cert.id}')">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Copiar Enlace
              </button>
            </div>

            <!-- EMBEDDED VISUAL PREVIEW TOGGLE -->
            <div class="preview-accordion">
              <button type="button" id="previewBtn" class="preview-toggle-btn" onclick="togglePreview()">
                <span>Ver vista previa del documento</span> ?
              </button>
              <div id="previewBox" class="preview-img-box">
                <img src="${previewUrl}" alt="Certificado ${cert.nombre}">
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function handleSearch(e) {
      if (e) e.preventDefault();
      const val = document.getElementById('certInput').value;
      if (!val) return;
      const cert = getCert(val);
      renderCert(cert);
      const url = new URL(window.location);
      url.searchParams.set('id', val);
      window.history.pushState({}, '', url);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(window.location.search);
      const id = p.get('id');
      if (id) {
        document.getElementById('certInput').value = id;
        const cert = getCert(id);
        renderCert(cert);
      }
    });
  </script>
</body>
</html>
